<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 132 136">
    {/* Define Gradient */}

    <defs>
        <filter id="glow" x="-50%" y="-50%" width="400%" height="400%">
            <!-- Blur the glow -->
            <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur" />
            <!-- Add the blur back on top of the original -->
            <feMerge>
